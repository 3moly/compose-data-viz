site_name: Compose Data Viz Docs
theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences

repo_name: 3moly/compose-data-viz
repo_url: https://github.com/3moly/compose-data-viz

nav:
  - index.md
  - 'Graph':
      - 'Sample': graph/graph.md
      - 'Nodes': graph/graph-nodes.md
      - 'Connections': graph/graph-connections.md
      - 'Lands': graph/graph-lands.md
      - 'Atlas': graph/graph-atlas.md
      - 'Engine': graph/graph-engine.md
  - 'Whiteboard':
      - 'Sample': whiteboard/whiteboard.md