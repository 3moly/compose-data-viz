[plugins]

androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
jetbrains-kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[versions]

agp = "9.2.1"
kotlin = "2.4.0"
compose = "1.11.1"

maven-publish = "0.36.0"
serialization = "1.11.0"
immutablelist = "0.4.0"

# FOR UNIT TEST
ktlint = "14.2.0"
slf4j = "2.0.18"
ktlintRule = "1.8.0"

# CONST
composedataviz = "0.1.63"
androidSdk = "36"
languageVersion = "17"
libraryNamespace = "io.github.moly3.composedatavizcore"
libraryGroup = "io.github.3moly"
dataVizCoreArtifact = "compose-data-viz-core"
dataVizArtifact = "compose-data-viz"

[libraries]

foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }


serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
immutablelist = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "immutablelist" }

# FOR UNIT TEST
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
slf4j = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }
ktlint-rule-engine = { module = "com.pinterest.ktlint:ktlint-rule-engine", version.ref = "ktlintRule" }
ktlint-ruleset-standard = { module = "com.pinterest.ktlint:ktlint-ruleset-standard", version.ref = "ktlintRule" }
ktlint-test = { module = "com.pinterest.ktlint:ktlint-test", version.ref = "ktlintRule" }
